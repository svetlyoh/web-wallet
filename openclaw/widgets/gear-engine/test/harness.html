<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gear Engine native host test</title>
<style>body{margin:0;background:#111922;color:#e4eaf2;font:15px system-ui;--bg:#111922;--text:#e4eaf2;--border:#526178}header{padding:20px;border-bottom:1px solid #526178;display:flex;justify-content:space-between}main{max-width:900px;margin:auto}.message{padding:22px;margin:16px;border:1px solid #526178;border-radius:12px}button{font:inherit}select option{background:Canvas;color:CanvasText}body.light{background:#fafafa;color:#202936;--bg:#fafafa;--text:#202936}</style>
<main><header><strong>OpenClaw · native host fixture</strong><button id="stop">Stop</button></header><div id="accessory"></div><div class="message">Synthetic test conversation. The plugin occupies its own header row.</div></main>
<script type="module">
import plugin from '../plugin/dist/control-ui/index.js';
const events=new Map(), listeners=new Set();let observer, view, context;
let rows=[{key:'agent:main:a',agentId:'main',label:'Research task',hasActiveRun:false,status:'done',inputTokens:1200,outputTokens:200}];
const abort=new AbortController();
const host={apiVersion:1,signal:abort.signal,connection:{connected:true,canRead:true},redact:x=>x,
subscribe(fn){listeners.add(fn);return()=>listeners.delete(fn)},
onEvent(name,fn){events.set(name,fn);return()=>events.delete(name)},
sessions:{normalizeKey:k=>k,observe(query,fn){observer=fn;fn({result:{sessions:rows,hasMore:false},loading:false,error:null});return{dispose(){observer=undefined},refresh:async()=>{}}}},
ui:{registerAccessory(value){context={host,props:{sessionKey:'agent:main:a',agentId:'main'},signal:abort.signal,presented:true};view=value.mount(document.querySelector('#accessory'),context);return()=>view.dispose()}}};
const nativeRaf=requestAnimationFrame;let frameCount=0;
window.requestAnimationFrame=fn=>nativeRaf(time=>{frameCount++;fn(time)});
plugin.activate(host);
window.fixture={get frames(){return frameCount}, get subscriptions(){return events.size+listeners.size},
  rows(value){rows=value;observer?.({result:{sessions:rows,hasMore:false},loading:false,error:null})},
  event(name,value){events.get(name)?.(value)},
  connect(value){host.connection.connected=value;listeners.forEach(fn=>fn())},
  access(value){host.connection.canRead=value;listeners.forEach(fn=>fn())},
  present(value){context={...context,presented:value};view.update(context)},
  dispose(){abort.abort()},
};
document.querySelector('#stop').onclick=()=>window.fixture.rows(rows.map(row=>({...row,hasActiveRun:false,status:'killed'})));
</script></html>
