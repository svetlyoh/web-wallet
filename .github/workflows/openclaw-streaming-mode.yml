name: OpenClaw Streaming Mode
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['openclaw/widgets/streaming-mode/**', '.github/workflows/openclaw-streaming-mode.yml']
  pull_request:
    paths: ['openclaw/widgets/streaming-mode/**', '.github/workflows/openclaw-streaming-mode.yml']
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: openclaw/widgets/streaming-mode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: npm test
      - name: Verify payload checksum and contents
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('payload/manifest.json'));
          const actual = createHash('sha256').update(readFileSync(`payload/${manifest.archive}`)).digest('hex');
          if (actual !== manifest.sha256) throw new Error(`Payload checksum mismatch: ${actual}`);
          NODE
          test -n "$(tar -tzf payload/control-ui.tar.gz | grep '/index.html$')"
          test -n "$(tar -tzf payload/control-ui.tar.gz | grep '\.br$')"
          test -n "$(tar -tzf payload/control-ui.tar.gz | grep '\.gz$')"
      - name: Install official matching OpenClaw host
        run: npm install --global openclaw@2026.9.6 --no-audit --no-fund
      - name: Install, verify, and roll back against the official package
        env:
          OPENCLAW_STATE_DIR: ${{ runner.temp }}/streaming-mode-openclaw
        run: |
          node scripts/install.mjs install
          node scripts/install.mjs status
          node scripts/install.mjs rollback
